services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    hostname: nginx-proxy
    ports:
      - "${SOC_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${SOC_BIND_ADDRESS:-127.0.0.1}:443:443"
      - "${SOC_BIND_ADDRESS:-127.0.0.1}:8080:80"
      - "${SOC_BIND_ADDRESS:-127.0.0.1}:8443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - real-web-app
      - web-honeypot
      - kibana
      - grafana
      - minio
    networks:
      - soc-net
    mem_limit: 256m

  honeypot:
    image: cowrie/cowrie:latest
    container_name: honeypot-cowrie
    restart: unless-stopped
    hostname: honeypot-cowrie
    ports:
      - "${SOC_BIND_ADDRESS:-127.0.0.1}:2222:2222"
    volumes:
      - cowrie-var:/cowrie/cowrie-git/var
      - cowrie-etc:/cowrie/cowrie-git/etc
    networks:
      - soc-net
    mem_limit: 256m

  real-web-app:
    build:
      context: ./real-web-app
    container_name: real-web-app
    restart: unless-stopped
    hostname: real-web-app
    networks:
      - soc-net
    mem_limit: 256m

  web-honeypot:
    build:
      context: ./web-honeypot
    container_name: web-honeypot
    restart: unless-stopped
    hostname: web-honeypot
    networks:
      - soc-net
    mem_limit: 256m

  falco:
    image: falcosecurity/falco:latest
    container_name: falco
    restart: unless-stopped
    hostname: falco
    privileged: true
    command:
      [
        "/usr/bin/falco",
        "-M",
        "0",
        "-o",
        "json_output=true",
        "-o",
        "json_include_output_property=true",
      ]
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
      - ./falco/falco_rules.local.yaml:/etc/falco/falco_rules.local.yaml:ro
    networks:
      - soc-net
    mem_limit: 512m

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch
    restart: unless-stopped
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${SOC_BIND_ADDRESS:-127.0.0.1}:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - soc-net
    mem_limit: 1g

  kibana:
    image: kibana:8.11.0
    container_name: kibana
    restart: unless-stopped
    hostname: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "${SOC_BIND_ADDRESS:-127.0.0.1}:5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - soc-net
    mem_limit: 512m

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    hostname: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${SOC_BIND_ADDRESS:-127.0.0.1}:3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - soc-net
    mem_limit: 512m

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    hostname: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${SOC_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - elasticsearch
      - loki
    networks:
      - soc-net
    mem_limit: 512m

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${SOC_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${SOC_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - soc-net
    mem_limit: 512m

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: filebeat
    restart: unless-stopped
    hostname: filebeat
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${SOC_BIND_ADDRESS:-127.0.0.1}:5066:5066"
    depends_on:
      - elasticsearch
    networks:
      - soc-net
    mem_limit: 256m

volumes:
  cowrie-var:
  cowrie-etc:
  elasticsearch-data:
  loki-data:
  grafana-data:
  minio-data:

networks:
  soc-net:
    driver: bridge
