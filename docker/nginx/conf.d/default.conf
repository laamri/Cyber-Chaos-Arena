log_format soc_json escape=json
    '{'
      '"timestamp":"$time_iso8601",'
      '"request_id":"$request_id",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":"$status",'
      '"bytes_sent":"$body_bytes_sent",'
      '"referer":"$http_referer",'
      '"user_agent":"$http_user_agent",'
      '"route_reason":"$route_reason",'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status"'
    '}';

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;
    access_log /var/log/nginx/access.log soc_json;

    set $upstream_target http://real-web-app:5000;
    set $route_reason normal_user;

    if ($http_cookie ~* "honeypot_portal_session=") {
        set $upstream_target http://web-honeypot:5001;
        set $route_reason suspicious_session;
    }

    if ($request_uri ~* "(wp-admin|wp-login|phpmyadmin|cgi-bin|\.env|etc/passwd|vendor/phpunit|HNAP1|boaform|shell|/admin)") {
        set $upstream_target http://web-honeypot:5001;
        set $route_reason suspicious_path;
    }

    if ($args ~* "(union|select|%27|%22|--|%2D%2D|%23|drop|insert|update|delete|or\+1=1|or%201=1|or%201%3D1)") {
        set $upstream_target http://web-honeypot:5001;
        set $route_reason suspicious_query_sqli;
    }

    if ($http_user_agent ~* "(sqlmap|nikto|nmap|masscan|zgrab|gobuster|dirbuster|hydra|wpscan|acunetix|burpsuite)") {
        set $upstream_target http://web-honeypot:5001;
        set $route_reason suspicious_user_agent;
    }

    if ($request_method !~ ^(GET|POST|HEAD)$) {
        set $upstream_target http://web-honeypot:5001;
        set $route_reason suspicious_method;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        add_header X-Route-Reason $route_reason always;
        add_header X-Upstream-Target $upstream_target always;
        add_header X-Request-ID $request_id always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Route-Reason $route_reason;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass $upstream_target;
    }
}
